[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moray"
version = "0.1.0"
description = "企业级实体提取 + 实体知识库（基于 AgentScope 2.0）"
requires-python = ">=3.11"
dependencies = [
    "agentscope==2.0.10",
    "python-dotenv>=1.0.0",
    "markitdown[pdf,docx,xlsx]==0.1.9",
    "pymupdf4llm==1.28.2",
]

[project.optional-dependencies]
db = ["asyncpg>=0.29.0"]
embed = ["fastembed>=0.4.0"]
mcp = ["mcp>=1.2.0"]
observability = [
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp>=1.45",
]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-multipart==0.0.32"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
